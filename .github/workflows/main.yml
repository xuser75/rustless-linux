name: Kernel De-Rust & .deb Build

on:
  push:
    branches: [ "main", "de-rust-mainline" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
      inputs:
        reason:
          description: 'Reason for running'
          required: false
          default: 'Manual trigger'

jobs:
  build-debian-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build & Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libelf-dev libssl-dev make gcc \
            libc6-dev binutils dwarves kmod rsync \
            debhelper fakeroot python3-minimal \
            build-essential libdw-dev  # <--- Added these two

      - name: Verify Rust Directory Removal
        run: |
          if [ -d "rust" ]; then
            echo "Error: rust/ directory still exists!"
            exit 1
          fi

      - name: Configure and Set Version
        run: |
          make defconfig
          # Set the custom version string
          scripts/config --set-str LOCALVERSION "-rustless"
          # Disable debug symbols to save disk space and build time
          scripts/config --disable DEBUG_INFO
          scripts/config --disable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          scripts/config --disable DEBUG_INFO_REDUCED
          make olddefconfig

      - name: Build Debian Packages
        run: |
          # bindeb-pkg generates the .deb files in the parent directory (..)
          make -j$(nproc) bindeb-pkg

      - name: Upload .deb Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-kernel-rustless-deb
          # We look in the parent directory for the results
          path: ../*.deb
          if-no-files-found: error
